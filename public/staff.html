<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>TableSense · Floor</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<link rel="stylesheet" href="/app.css">
<style>
.layout{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:900px){.layout{grid-template-columns:minmax(0,1fr)}}
.cam{background:var(--cam);color:var(--cam-fg);border-radius:12px;padding:14px}
.floor{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.tbl{border:2px solid var(--c);background:color-mix(in srgb,var(--c) 20%,transparent);border-radius:10px;padding:10px;display:grid;gap:3px;font-family:var(--f-mono);font-size:.74rem}
.tbl b{font-size:1rem}.tbl .st{color:var(--c);text-transform:uppercase;letter-spacing:.05em}
.tbl.alarm{animation:pulse 1s infinite}@keyframes pulse{50%{background:color-mix(in srgb,var(--c) 45%,transparent)}}
.tbl .acts{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
.tbl .acts button{background:transparent;color:var(--cam-fg);border-color:color-mix(in srgb,var(--cam-fg) 30%,transparent);padding:2px 7px;font-size:.72rem}
.legend{display:flex;gap:12px;flex-wrap:wrap;margin-top:12px;font-family:var(--f-mono);font-size:.68rem}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;background:var(--c);margin-right:5px}
.alerts{display:grid;gap:8px}
.alert{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px;border-radius:10px;border:1px solid var(--line);border-left:4px solid var(--c);font-size:.9rem}
.alert.done{opacity:.5}
.src{font-family:var(--f-mono);font-size:.62rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
</style></head>
<body>
<div class="wrap" id="root"></div>
<script src="/socket.io/socket.io.js"></script>
<script src="/common.js"></script>
<script>
const { esc, money, api, toast, ago, time } = TS;
const COLOR = { free: '--free', seated: '--seated', ordered: '--ordered', eating: '--eating', dirty: '--dirty' };
const LABEL = { free: 'Free', seated: 'Seated · no order', ordered: 'Ordered', eating: 'Eating', dirty: 'Needs cleaning' };
const KIND = { waiting: ['--seated', 'On my way'], call: ['--saffron', 'On my way'], bill: ['--saffron', 'On my way'], clean: ['--dirty', 'Cleaned'], ready: ['--ordered', 'Served'], payment: ['--free', ''], unpaid: ['--dirty', 'Checked'] };
let data, seenAlerts = new Set(), audio;

function beep() {
  try { audio = audio || new AudioContext(); const o = audio.createOscillator(), g = audio.createGain(); o.frequency.value = 880; g.gain.value = .08; o.connect(g).connect(audio.destination); o.start(); o.stop(audio.currentTime + .18); } catch {}
}
async function load() {
  data = await api('/api/staff'); TS.setCurrency(data.settings.currency);
  const fresh = data.alerts.filter(a => !a.doneAt && !seenAlerts.has(a.id));
  if (seenAlerts.size && fresh.length) beep();
  data.alerts.forEach(a => seenAlerts.add(a.id));
  render();
}
function render() {
  const open = data.alerts.filter(a => !a.doneAt);
  const used = data.tables.filter(t => !['free', 'dirty'].includes(t.state));
  document.title = open.length ? `(${open.length}) TableSense · Floor` : 'TableSense · Floor';
  const tables = data.tables.map(t => {
    const v = t.visit, alarm = open.some(a => a.tableId === t.id && ['waiting', 'call', 'bill', 'clean', 'unpaid'].includes(a.kind));
    const acts = [];
    if (t.state === 'free') acts.push(`<button data-seat="${t.id}">Seat guests</button>`);
    if (v && !v.waiterAt) acts.push(`<button data-waiter="${t.id}">Waiter visited</button>`);
    if (v) acts.push(`<button data-leave="${t.id}">Guests left</button>`);
    if (t.state === 'dirty') acts.push(`<button data-clean="${t.id}">Cleaned</button>`);
    return `<div class="tbl ${alarm ? 'alarm' : ''}" style="--c:var(${COLOR[t.state]})">
      <div class="row"><b>${esc(t.id)}</b><span>${v ? `${v.guests} guest${v.guests > 1 ? 's' : ''}` : `${t.seats} seats`}</span></div>
      <span class="st">${LABEL[t.state]}</span><span>${ago(t.since)}</span>
      ${v ? `<span>${v.waiterAt ? 'Waiter visited' : 'No waiter yet'}${v.scannedAt ? ' · QR scanned' : ''}</span>` : ''}
      ${t.bill && t.bill.total ? `<span>Bill ${money(t.bill.total)}${t.bill.due ? ` · due ${money(t.bill.due)}` : ' · paid'}</span>` : ''}
      <div class="acts">${acts.join('')}</div></div>`;
  }).join('');
  const alerts = data.alerts.slice(0, 30).map(a => {
    const [c, label] = KIND[a.kind] || ['--muted', 'Done'];
    let btn = label ? `<button class="mini" data-ack="${a.id}">${label}</button>` : '';
    if (a.kind === 'payment' && !a.doneAt) {
      const t = data.tables.find(x => x.id === a.tableId), p = t.visit && t.visit.payments.filter(p => !p.confirmed).slice(-1)[0];
      btn = p ? `<button class="mini" data-confirm="${a.tableId}|${p.id}">Confirm ${money(p.amount + p.tip)}</button>` : `<button class="mini" data-ack="${a.id}">OK</button>`;
    }
    return `<div class="alert ${a.doneAt ? 'done' : ''}" style="--c:var(${c})"><b style="font-family:var(--f-mono)">${esc(a.tableId)}</b>
      <div><div class="src">${esc(a.source)} · ${time(a.at)}</div>${esc(a.text)}</div>${a.doneAt ? '<span class="tag">Done</span>' : btn}</div>`;
  }).join('');
  document.getElementById('root').innerHTML = `${TS.nav('/staff')}
    <div class="layout">
      <section class="panel"><div class="ph"><h2>Floor</h2><span class="tag">${used.length}/${data.tables.length} tables in use · ${used.reduce((a, t) => a + (t.visit ? t.visit.guests : 0), 0)} guests</span></div>
        <div class="cam"><div class="floor">${tables}</div>
        <div class="legend">${Object.keys(LABEL).map(k => `<span style="--c:var(${COLOR[k]})"><i></i>${LABEL[k]}</span>`).join('')}</div></div></section>
      <section class="panel"><div class="ph"><h2>Alerts</h2><span class="tag">${open.length} open</span></div>
        <div class="alerts">${alerts || '<div class="empty">No alerts. Every table is looked after.</div>'}</div></section>
    </div>`;
}
document.addEventListener('click', async e => {
  const b = e.target.closest('button'); if (!b) return;
  const d = b.dataset;
  try {
    if (d.ack) await api(`/api/alerts/${d.ack}/ack`, { body: {} });
    if (d.seat) await api(`/api/tables/${d.seat}/seat`, { body: { guests: 2 } });
    if (d.waiter) await api(`/api/tables/${d.waiter}/waiter`, { body: {} });
    if (d.leave) await api(`/api/tables/${d.leave}/leave`, { body: {} });
    if (d.clean) await api(`/api/tables/${d.clean}/clean`, { body: {} });
    if (d.confirm) { const [t, p] = d.confirm.split('|'); await api(`/api/tables/${t}/payments/${p}/confirm`, { body: {} }); toast('Payment confirmed.'); }
    await load();
  } catch (err) { toast(err.message); }
});
TS.staffGate(() => TS.live(load));
</script>
</body></html>
