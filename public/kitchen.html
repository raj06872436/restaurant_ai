<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>TableSense · Kitchen</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<link rel="stylesheet" href="/app.css">
<style>
.cols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;align-items:start}
@media (max-width:760px){.cols{grid-template-columns:minmax(0,1fr)}}
.col{display:grid;gap:10px}
.ticket{border:1px solid var(--line);border-top:4px solid var(--c);border-radius:10px;padding:12px;background:var(--panel);display:grid;gap:6px}
.ticket .line{display:flex;gap:8px;font-size:1rem}.ticket .q{font-family:var(--f-mono);font-weight:600;min-width:2em}
.x{padding:0 8px;color:var(--muted)}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--panel);color:var(--fg);padding:18px;width:min(360px,calc(100vw - 32px))}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog form{display:grid;gap:10px}
dialog input{width:100%}
.late{color:var(--dirty);font-weight:600}
</style></head>
<body>
<div class="wrap" id="root"></div>
<dialog id="sheet"></dialog>
<script src="/socket.io/socket.io.js"></script>
<script src="/common.js"></script>
<script>
const { esc, api, toast, ago } = TS;
const w = TS.t();
const COLS = [['new', 'colNew', '--ordered', 'startCooking'], ['cooking', 'colCooking', '--saffron', 'markReady'], ['ready', 'colReady', '--free', 'served']];
let menu = [];
const dish = l => { const m = menu.find(x => x.id === l.id); return (TS.lang() === 'hi' && m && m.nameHi) || l.name; };
async function load() {
  const data = await api('/api/staff'); menu = data.menu;
  document.getElementById('root').innerHTML = `${TS.nav('/kitchen')}<div class="cols">${COLS.map(([st, title, c, btn]) => {
    const list = data.orders.filter(o => o.status === st).sort((a, b) => a.at - b.at);
    return `<section class="col"><div class="ph"><h2>${w[title]}</h2><span class="tag">${list.length}</span></div>
      ${list.map(o => { const mins = Math.floor((Date.now() - o.at) / 60000);
        return `<div class="ticket" style="--c:var(${c})"><div class="row"><b>${esc(o.tableId)}</b><span class="tag ${mins >= 20 && st !== 'ready' ? 'late' : ''}">${ago(o.at)}</span></div>
        ${o.lines.map(l => `<div class="line"><span class="q">${l.qty}×</span><span style="flex:1">${esc(dish(l))}${l.note ? `<br><small class="muted">${esc(l.note)}</small>` : ''}</span>
          <button class="mini x" data-cancel="${o.id}" data-item="${esc(l.id)}" data-name="${esc(dish(l))}" data-qty="${l.qty}" data-table="${esc(o.tableId)}" aria-label="${w.cancelItem} ${esc(dish(l))}">×</button></div>`).join('')}
        ${(o.cancelled || []).map(c => `<div class="line muted"><s>${c.qty}× ${esc(c.name)}</s><small>${esc(c.reason)}</small></div>`).join('')}
        <div class="row"><button class="primary" style="flex:1" data-adv="${o.id}">${w[btn]}</button><a href="/print/kot/${o.id}" target="_blank"><button class="mini">${w.printKot}</button></a></div></div>`; }).join('') || `<div class="empty">${w.nothing}</div>`}</section>`;
  }).join('')}</div>`;
}
document.addEventListener('click', e => {
  const b = e.target.closest('[data-cancel]'); if (!b) return;
  const d = b.dataset, sheet = document.getElementById('sheet');
  sheet.innerHTML = `<form data-order="${esc(d.cancel)}" data-item="${esc(d.item)}"><h3>${w.cancelWhat(esc(d.name), esc(d.table))}</h3>
    <label>${w.howMany}<input name="qty" type="number" min="1" max="${d.qty}" value="${d.qty}" required></label>
    <label>${w.reasonL}<input name="reason" type="text" maxlength="100" required placeholder="${w.cancelReasonPh}"></label>
    <button class="primary">${w.cancelItem}</button><div class="err" id="sheet-err"></div><button type="button" onclick="this.closest('dialog').close()">${w.close}</button></form>`;
  sheet.showModal();
});
document.getElementById('sheet').addEventListener('submit', async e => {
  e.preventDefault();
  const f = e.target;
  try {
    await api(`/api/orders/${f.dataset.order}/cancel`, { body: { item: f.dataset.item, qty: Number(f.elements.qty.value), reason: f.elements.reason.value } });
    document.getElementById('sheet').close(); toast(w.cancelDone); await load();
  } catch (err) { document.getElementById('sheet-err').textContent = err.message; }
});
document.addEventListener('click', async e => {
  const b = e.target.closest('[data-adv]'); if (!b) return;
  try { await api(`/api/orders/${b.dataset.adv}/advance`, { body: {} }); await load(); } catch (err) { toast(err.message); }
});
TS.staffGate(() => TS.live(load), 'kitchen');
</script>
</body></html>
