<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>TableSense · Menu & settings</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<link rel="stylesheet" href="/app.css">
<style>
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.6fr);gap:18px;align-items:start}
@media (max-width:900px){.two{grid-template-columns:minmax(0,1fr)}}
form{display:grid;gap:14px}
fieldset{border:1px solid var(--line);border-radius:10px;padding:12px;display:grid;gap:10px;margin:0}
legend{font-weight:600;padding:0 6px}
label{display:grid;gap:4px;font-size:.88rem;min-width:0}
label input[type=text],label input[type=number]{width:100%;min-width:0}
label.check{display:flex;align-items:center;gap:8px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.tables{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px}
.trow{display:flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:6px 8px}
.trow input{width:56px;padding:5px}
.menu{width:100%;border-collapse:collapse;font-size:.9rem}
.menu th{text-align:left;font-weight:500;color:var(--muted);font-size:.78rem;padding:6px}
.menu td{padding:4px;border-top:1px solid var(--line);vertical-align:middle}
.menu input[type=text],.menu input[type=number]{width:100%;padding:6px 8px}
.menu td.c{text-align:center}
.scroll{overflow-x:auto}
.menu{min-width:860px}
.photo{display:grid;place-items:center;width:52px;height:52px;border:1px dashed var(--line);border-radius:8px;cursor:pointer;overflow:hidden;font-size:.7rem;color:var(--muted);text-align:center}
.photo img{width:100%;height:100%;object-fit:cover}
.linkish{border:0;background:none;color:var(--muted);padding:2px 0;font-size:.72rem}
.save{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.teamlist{display:grid;gap:10px}
.person{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;align-items:end;padding:10px;border:1px solid var(--line);border-radius:10px}
select{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:8px;width:100%}
.person input[type=password]{width:100%;min-width:0}
</style></head>
<body>
<div class="wrap" id="root"></div>
<script src="/socket.io/socket.io.js"></script>
<script src="/common.js"></script>
<script>
const { esc, api, toast } = TS;
const w = TS.t();
const METHODS = ['online', 'cash', 'card', 'upi', 'bank'];
let data, menu, tables, team;

async function load() {
  [data, team] = await Promise.all([api('/api/staff'), api('/api/team')]);
  menu = data.menu.map(m => ({ ...m }));
  tables = data.tables.map(t => ({ id: t.id, seats: t.seats, busy: !!t.visitId }));
  team = team.map(s => ({ ...s, pin: '' }));
  render();
}
function render() {
  const s = data.settings, pay = s.payments || { methods: [], upi: {} };
  const cats = [...new Set(menu.map(m => m.cat))];
  document.getElementById('root').innerHTML = `${TS.nav('/settings')}
  <div class="two">
    <div style="display:grid;gap:18px;min-width:0">
    <section class="panel"><div class="ph"><h2>${w.restaurant}</h2></div>
      <form id="settings">
        <div class="grid2"><label>${w.rName}<input id="s-name" type="text" value="${esc(s.name)}" required></label>
        <label>${w.currency}<input id="s-cur" type="text" value="${esc(s.currency)}" maxlength="5"></label></div>
        <fieldset><legend>${w.wifi}</legend><div class="grid2">
          <label>${w.network}<input id="s-net" type="text" value="${esc(s.wifi.network)}"></label>
          <label>${w.password}<input id="s-pass" type="text" value="${esc(s.wifi.password)}"></label></div></fieldset>
        <fieldset><legend>${w.alertsSet}</legend><div class="grid2">
          <label>${w.waitMin}<input id="s-wait" type="number" min="1" max="60" value="${s.noOrderAlertMin}"></label>
          <label>${w.readyMin}<input id="s-ready" type="number" min="1" max="60" value="${s.readyNotServedAlertMin}"></label></div></fieldset>
        <fieldset><legend>${w.payWays}</legend>
          <div class="chips">${METHODS.map(id => `<label class="check"><input type="checkbox" id="pm-${id}" ${pay.methods.includes(id) ? 'checked' : ''}> ${w.methodName[id]}</label>`).join('')}</div>
          <div class="grid2"><label>${w.upiId}<input id="s-vpa" type="text" placeholder="restaurant@okhdfcbank" value="${esc(pay.upi && pay.upi.vpa)}"></label>
          <label>${w.upiName}<input id="s-payee" type="text" value="${esc(pay.upi && pay.upi.payee)}"></label></div>
          <span class="muted" style="font-size:.82rem">${w.upiHelp}</span>
          <span class="${data.online && data.online.ready ? 'muted' : 'err'}" style="font-size:.82rem">${data.online && data.online.ready ? w.onlineOn(data.online.testMode, data.online.webhook) : w.onlineOff}</span></fieldset>
        <fieldset><legend>${w.tables}</legend>
          <div class="tables">${tables.map((t, i) => `<div class="trow"><b style="flex:1">${esc(t.id)}</b><input type="number" min="1" max="30" value="${t.seats}" data-seats="${i}" aria-label="${w.seatsWord} ${esc(t.id)}"><span class="muted" style="font-size:.75rem">${w.seatsWord}</span>
            ${t.busy ? '' : `<button type="button" class="mini" data-deltable="${i}" aria-label="× ${esc(t.id)}">×</button>`}</div>`).join('')}</div>
          <div class="save"><input id="newtable" type="text" placeholder="${w.newTable}" style="width:170px"><button type="button" data-act="addtable">${w.addTable}</button></div>
          <span class="muted" style="font-size:.82rem">${w.tablesHelp}</span></fieldset>
        <div class="save"><button class="primary">${w.saveSettings}</button><span class="err" id="s-err"></span></div>
      </form>
    </section>
    <section class="panel"><div class="ph"><h2>${w.staff}</h2><span class="tag">${team.filter(p => p.active).length}</span></div>
      <div class="teamlist">${team.map((p, i) => `<div class="person">
        <label>${w.tName}<input type="text" data-p="${i}" data-pf="name" value="${esc(p.name)}"></label>
        <label>${w.role}<select data-p="${i}" data-pf="role">${Object.keys(w.roles).map(r => `<option value="${r}" ${p.role === r ? 'selected' : ''}>${w.roles[r]}</option>`).join('')}</select></label>
        <label>${w.newPin}<input type="password" inputmode="numeric" autocomplete="new-password" data-p="${i}" data-pf="pin" value="${esc(p.pin)}" placeholder="${p.id ? w.pinKeep : '1234'}"></label>
        <label class="check"><input type="checkbox" data-p="${i}" data-pf="active" ${p.active ? 'checked' : ''}> ${w.active}</label></div>`).join('')}</div>
      <div class="save" style="margin-top:12px"><button data-act="addperson">${w.addPerson}</button><button class="primary" data-act="saveteam">${w.saveTeam}</button><span class="err" id="t-err"></span></div>
      <p class="muted" style="font-size:.82rem">${w.teamHelp}</p>
    </section>
    </div>
    <section class="panel"><div class="ph"><h2>${w.menu}</h2><span class="tag">${w.dishes(menu.length)}</span></div>
      <datalist id="cats">${cats.map(c => `<option value="${esc(c)}">`).join('')}</datalist>
      <div class="scroll"><table class="menu"><thead><tr><th>${w.mPhoto}</th><th>${w.mDish}</th><th>${w.mHindi}</th><th>${w.mDesc}</th><th>${w.mCat}</th><th style="width:90px">${w.mPrice}</th><th>${w.mVeg}</th><th>${w.mShow}</th><th></th></tr></thead>
      <tbody>${menu.map((m, i) => `<tr>
        <td><label class="photo">${m.photo ? `<img src="${esc(m.photo)}" alt="">` : `<span>${w.addPhoto}</span>`}<input type="file" accept="image/jpeg,image/png,image/webp" data-photo="${i}" hidden></label>
          ${m.photo ? `<button class="mini linkish" data-nophoto="${i}">${w.removePhoto}</button>` : ''}</td>
        <td><input type="text" data-i="${i}" data-f="name" value="${esc(m.name)}" aria-label="${w.mDish}"></td>
        <td><input type="text" data-i="${i}" data-f="nameHi" value="${esc(m.nameHi)}" placeholder="${w.optional}" aria-label="${w.mHindi}"></td>
        <td><input type="text" data-i="${i}" data-f="desc" value="${esc(m.desc)}" aria-label="${w.mDesc}"></td>
        <td><input type="text" list="cats" data-i="${i}" data-f="cat" value="${esc(m.cat)}" aria-label="${w.mCat}"></td>
        <td><input type="number" min="0" data-i="${i}" data-f="price" value="${m.price}" aria-label="${w.mPrice}"></td>
        <td class="c"><input type="checkbox" data-i="${i}" data-f="veg" ${m.veg ? 'checked' : ''} aria-label="${w.mVeg}"></td>
        <td class="c"><input type="checkbox" data-i="${i}" data-f="show" ${m.hidden ? '' : 'checked'} aria-label="${w.mShow}"></td>
        <td><button class="mini" data-deldish="${i}" aria-label="× ${esc(m.name)}">×</button></td></tr>`).join('')}</tbody></table></div>
      <div class="save" style="margin-top:12px"><button data-act="adddish">${w.addDish}</button><button class="primary" data-act="savemenu">${w.saveMenu}</button><span class="err" id="m-err"></span></div>
      <p class="muted" style="font-size:.82rem">${w.menuHelp}</p>
    </section>
  </div>`;
}
document.addEventListener('input', e => {
  const el = e.target;
  if (el.dataset.f) {
    const m = menu[+el.dataset.i], f = el.dataset.f;
    if (f === 'show') m.hidden = !el.checked; else if (f === 'veg') m.veg = el.checked;
    else m[f] = f === 'price' ? Number(el.value) : el.value;
  }
  if (el.dataset.pf) { const p = team[+el.dataset.p]; p[el.dataset.pf] = el.type === 'checkbox' ? el.checked : el.value; }
  if (el.dataset.seats) tables[+el.dataset.seats].seats = Number(el.value);
});
document.addEventListener('change', async e => {
  const el = e.target;
  if (el.dataset.pf === 'role') team[+el.dataset.p].role = el.value;
  if (!el.dataset.photo) return;
  const file = el.files[0]; if (!file) return;
  try {
    const res = await fetch('/api/menu/photo', { method: 'POST', headers: { 'content-type': file.type }, body: file });
    const out = await res.json();
    if (!res.ok) throw new Error(out.error || 'Upload failed.');
    menu[+el.dataset.photo].photo = out.url; render(); toast(w.photoAdded);
  } catch (err) { toast(err.message); }
});
document.addEventListener('click', async e => {
  const b = e.target.closest('button'); if (!b || b.dataset.ts) return;
  const d = b.dataset;
  if (d.deldish) { menu.splice(+d.deldish, 1); render(); }
  if (d.nophoto) { menu[+d.nophoto].photo = ''; render(); toast(w.photoRemoved); }
  if (d.deltable) { tables.splice(+d.deltable, 1); render(); }
  if (d.act === 'adddish') { menu.push({ name: '', desc: '', cat: menu.length ? menu[menu.length - 1].cat : 'Mains', price: 0 }); render(); document.querySelector(`[data-i="${menu.length - 1}"][data-f="name"]`).focus(); }
  if (d.act === 'addperson') { team.push({ name: '', role: 'waiter', active: true, pin: '' }); render(); document.querySelector(`[data-p="${team.length - 1}"][data-pf="name"]`).focus(); }
  if (d.act === 'addtable') {
    const id = document.getElementById('newtable').value.trim().toUpperCase();
    if (!id) return toast(w.typeTable);
    if (tables.some(t => t.id === id)) return toast(w.exists(id));
    tables.push({ id, seats: 4 }); render();
  }
  if (d.act === 'savemenu') {
    try { await api('/api/menu', { method: 'PUT', body: { menu } }); toast(w.menuSaved); await load(); }
    catch (err) { document.getElementById('m-err').textContent = err.message; }
  }
  if (d.act === 'saveteam') {
    try { await api('/api/team', { method: 'PUT', body: { staff: team } }); toast(w.teamSaved); await load(); }
    catch (err) { document.getElementById('t-err').textContent = err.message; }
  }
});
document.addEventListener('submit', async e => {
  if (e.target.id !== 'settings') return;
  e.preventDefault();
  const v = id => document.getElementById(id).value;
  try {
    await api('/api/settings', { method: 'PUT', body: {
      name: v('s-name'), currency: v('s-cur'), wifi: { network: v('s-net'), password: v('s-pass') },
      noOrderAlertMin: Number(v('s-wait')), readyNotServedAlertMin: Number(v('s-ready')),
      payments: { methods: METHODS.filter(id => document.getElementById('pm-' + id).checked), upi: { vpa: v('s-vpa'), payee: v('s-payee') } },
      tables: tables.map(t => ({ id: t.id, seats: t.seats })),
    } });
    toast(w.settingsSaved); await load();
  } catch (err) { document.getElementById('s-err').textContent = err.message; }
});
TS.staffGate(load, 'settings');
</script>
</body></html>
