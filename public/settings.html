<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>TableSense · Menu & settings</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<link rel="stylesheet" href="/app.css">
<style>
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.6fr);gap:18px;align-items:start}
@media (max-width:900px){.two{grid-template-columns:minmax(0,1fr)}}
form{display:grid;gap:14px}
fieldset{border:1px solid var(--line);border-radius:10px;padding:12px;display:grid;gap:10px;margin:0}
legend{font-weight:600;padding:0 6px}
label{display:grid;gap:4px;font-size:.88rem;min-width:0}
label input[type=text],label input[type=number]{width:100%;min-width:0}
label.check{display:flex;align-items:center;gap:8px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.tables{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px}
.trow{display:flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:6px 8px}
.trow input{width:56px;padding:5px}
.menu{width:100%;border-collapse:collapse;font-size:.9rem}
.menu th{text-align:left;font-weight:500;color:var(--muted);font-size:.78rem;padding:6px}
.menu td{padding:4px;border-top:1px solid var(--line);vertical-align:middle}
.menu input[type=text],.menu input[type=number]{width:100%;padding:6px 8px}
.menu td.c{text-align:center}
.scroll{overflow-x:auto}
.save{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
</style></head>
<body>
<div class="wrap" id="root"></div>
<script src="/socket.io/socket.io.js"></script>
<script src="/common.js"></script>
<script>
const { esc, api, toast } = TS;
const METHODS = [['cash', 'Cash'], ['card', 'Card'], ['upi', 'UPI'], ['bank', 'Bank transfer']];
let data, menu, tables;

async function load() {
  data = await api('/api/staff');
  menu = data.menu.map(m => ({ ...m }));
  tables = data.tables.map(t => ({ id: t.id, seats: t.seats, busy: !!t.visitId }));
  render();
}
function render() {
  const s = data.settings, pay = s.payments || { methods: [], upi: {} };
  const cats = [...new Set(menu.map(m => m.cat))];
  document.getElementById('root').innerHTML = `${TS.nav('/settings')}
  <div class="two">
    <section class="panel"><div class="ph"><h2>Restaurant</h2></div>
      <form id="settings">
        <div class="grid2"><label>Restaurant name<input id="s-name" type="text" value="${esc(s.name)}" required></label>
        <label>Currency sign<input id="s-cur" type="text" value="${esc(s.currency)}" maxlength="5"></label></div>
        <fieldset><legend>Guest Wi-Fi</legend><div class="grid2">
          <label>Network<input id="s-net" type="text" value="${esc(s.wifi.network)}"></label>
          <label>Password<input id="s-pass" type="text" value="${esc(s.wifi.password)}"></label></div></fieldset>
        <fieldset><legend>Alerts</legend><div class="grid2">
          <label>Alert when guests wait with no order or waiter for (min)<input id="s-wait" type="number" min="1" max="60" value="${s.noOrderAlertMin}"></label>
          <label>Alert when ready food isn't served for (min)<input id="s-ready" type="number" min="1" max="60" value="${s.readyNotServedAlertMin}"></label></div></fieldset>
        <fieldset><legend>Ways to pay</legend>
          <div class="chips">${METHODS.map(([id, l]) => `<label class="check"><input type="checkbox" id="pm-${id}" ${pay.methods.includes(id) ? 'checked' : ''}> ${l}</label>`).join('')}</div>
          <div class="grid2"><label>UPI ID<input id="s-vpa" type="text" placeholder="restaurant@okhdfcbank" value="${esc(pay.upi && pay.upi.vpa)}"></label>
          <label>Name shown in UPI app<input id="s-payee" type="text" value="${esc(pay.upi && pay.upi.payee)}"></label></div>
          <span class="muted" style="font-size:.82rem">With UPI, guests get a link and QR code for the exact amount, and the money goes straight to this UPI ID. Staff confirm it on the floor screen.</span></fieldset>
        <fieldset><legend>Tables</legend>
          <div class="tables">${tables.map((t, i) => `<div class="trow"><b style="flex:1">${esc(t.id)}</b><input type="number" min="1" max="30" value="${t.seats}" data-seats="${i}" aria-label="Seats at ${esc(t.id)}"><span class="muted" style="font-size:.75rem">seats</span>
            ${t.busy ? '' : `<button type="button" class="mini" data-deltable="${i}" aria-label="Remove ${esc(t.id)}">×</button>`}</div>`).join('')}</div>
          <div class="save"><input id="newtable" type="text" placeholder="New table, e.g. T9" style="width:170px"><button type="button" data-act="addtable">Add table</button></div>
          <span class="muted" style="font-size:.82rem">New tables need a QR code printed from the QR codes page, and a zone drawn in the camera setup.</span></fieldset>
        <div class="save"><button class="primary">Save settings</button><span class="err" id="s-err"></span></div>
      </form>
    </section>
    <section class="panel"><div class="ph"><h2>Menu</h2><span class="tag">${menu.length} dishes</span></div>
      <datalist id="cats">${cats.map(c => `<option value="${esc(c)}">`).join('')}</datalist>
      <div class="scroll"><table class="menu"><thead><tr><th>Dish</th><th>Description</th><th>Category</th><th style="width:90px">Price</th><th>Veg</th><th>Show</th><th></th></tr></thead>
      <tbody>${menu.map((m, i) => `<tr>
        <td><input type="text" data-i="${i}" data-f="name" value="${esc(m.name)}" aria-label="Dish name"></td>
        <td><input type="text" data-i="${i}" data-f="desc" value="${esc(m.desc)}" aria-label="Description"></td>
        <td><input type="text" list="cats" data-i="${i}" data-f="cat" value="${esc(m.cat)}" aria-label="Category"></td>
        <td><input type="number" min="0" data-i="${i}" data-f="price" value="${m.price}" aria-label="Price"></td>
        <td class="c"><input type="checkbox" data-i="${i}" data-f="veg" ${m.veg ? 'checked' : ''} aria-label="Vegetarian"></td>
        <td class="c"><input type="checkbox" data-i="${i}" data-f="show" ${m.hidden ? '' : 'checked'} aria-label="Show on menu"></td>
        <td><button class="mini" data-deldish="${i}" aria-label="Delete ${esc(m.name)}">×</button></td></tr>`).join('')}</tbody></table></div>
      <div class="save" style="margin-top:12px"><button data-act="adddish">Add dish</button><button class="primary" data-act="savemenu">Save menu</button><span class="err" id="m-err"></span></div>
      <p class="muted" style="font-size:.82rem">Untick "Show" when a dish runs out. It disappears from guests' phones right away.</p>
    </section>
  </div>`;
}
document.addEventListener('input', e => {
  const el = e.target;
  if (el.dataset.f) {
    const m = menu[+el.dataset.i], f = el.dataset.f;
    if (f === 'show') m.hidden = !el.checked; else if (f === 'veg') m.veg = el.checked;
    else m[f] = f === 'price' ? Number(el.value) : el.value;
  }
  if (el.dataset.seats) tables[+el.dataset.seats].seats = Number(el.value);
});
document.addEventListener('click', async e => {
  const b = e.target.closest('button'); if (!b) return;
  const d = b.dataset;
  if (d.deldish) { menu.splice(+d.deldish, 1); render(); }
  if (d.deltable) { tables.splice(+d.deltable, 1); render(); }
  if (d.act === 'adddish') { menu.push({ name: '', desc: '', cat: menu.length ? menu[menu.length - 1].cat : 'Mains', price: 0 }); render(); document.querySelector(`[data-i="${menu.length - 1}"][data-f="name"]`).focus(); }
  if (d.act === 'addtable') {
    const id = document.getElementById('newtable').value.trim().toUpperCase();
    if (!id) return toast('Type a name for the new table.');
    if (tables.some(t => t.id === id)) return toast(`${id} already exists.`);
    tables.push({ id, seats: 4 }); render();
  }
  if (d.act === 'savemenu') {
    try { await api('/api/menu', { method: 'PUT', body: { menu } }); toast('Menu saved.'); await load(); }
    catch (err) { document.getElementById('m-err').textContent = err.message; }
  }
});
document.addEventListener('submit', async e => {
  if (e.target.id !== 'settings') return;
  e.preventDefault();
  const v = id => document.getElementById(id).value;
  try {
    await api('/api/settings', { method: 'PUT', body: {
      name: v('s-name'), currency: v('s-cur'), wifi: { network: v('s-net'), password: v('s-pass') },
      noOrderAlertMin: Number(v('s-wait')), readyNotServedAlertMin: Number(v('s-ready')),
      payments: { methods: METHODS.map(([id]) => id).filter(id => document.getElementById('pm-' + id).checked), upi: { vpa: v('s-vpa'), payee: v('s-payee') } },
      tables: tables.map(t => ({ id: t.id, seats: t.seats })),
    } });
    toast('Settings saved.'); await load();
  } catch (err) { document.getElementById('s-err').textContent = err.message; }
});
TS.staffGate(load);
</script>
</body></html>
